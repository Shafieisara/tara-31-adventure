<!DOCTYPE html>
<html lang="fa" dir="rtl" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="google" content="notranslate">
<title>Since 2015 — ۳۱ اتاق با تارا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1b2430; --gold:#e0a85c; --cream:#f7f1e8; --sky:#87CEEB;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:
      radial-gradient(1000px 560px at 50% -8%, #e8f7ff 0%, #9fd0ef 40%, #5a9ec8 78%, #3d7aa8 100%);
    font-family: Vazirmatn, Tahoma, sans-serif; color:var(--ink); overflow:hidden;
  }
  #shell{position:relative; line-height:0; max-width:100vw}
  canvas#game{
    display:block; border-radius:18px;
    box-shadow:0 18px 56px rgba(20,50,80,.3), 0 0 0 1px rgba(255,255,255,.4);
    max-width:96vw; max-height:calc(100vh - 56px); width:auto; height:auto;
    background:#7ec8ea; cursor:pointer;
  }
  #hud{
    position:absolute; inset:10px 12px auto 12px; display:flex; justify-content:space-between;
    align-items:flex-start; pointer-events:none; z-index:5; line-height:1.2;
  }
  #hud .brand{
    background:rgba(18,24,22,.62); color:var(--gold); padding:8px 14px; border-radius:999px;
    font-size:12px; letter-spacing:.12em; backdrop-filter:blur(6px);
    font-family: Fraunces, Georgia, serif;
  }
  #hud .stats{
    background:rgba(18,24,22,.55); color:#fff; padding:8px 12px; border-radius:12px;
    font-size:12.5px; backdrop-filter:blur(6px); text-align:left; direction:ltr
  }
  #roomBanner{
    position:absolute; left:50%; top:54px; transform:translateX(-50%);
    z-index:6; text-align:center; pointer-events:none;
    background:rgba(18,24,22,.55); color:#fff; padding:8px 18px; border-radius:14px;
    backdrop-filter:blur(8px); min-width:120px; direction:rtl;
  }
  #roomBanner.hidden{display:none}
  #roomBanner .rb-n{font-family:Fraunces,Georgia,serif; color:var(--gold); font-size:12px; letter-spacing:.08em}
  #roomBanner .rb-t{font-size:15px; font-weight:700; margin-top:2px}
  #roomBanner .rb-y{font-size:11px; opacity:.75; margin-top:2px; direction:ltr}
  #title{
    position:absolute; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:10px; border-radius:18px; text-align:center; padding:24px;
    background:
      linear-gradient(165deg, rgba(232,247,255,.95), rgba(180,230,210,.9)),
      radial-gradient(600px 280px at 50% 0%, rgba(255,210,140,.35), transparent 70%);
  }
  #title.hidden{display:none}
  #title .since{font-family:Fraunces,Georgia,serif; letter-spacing:.2em; color:#c07020; font-weight:700; font-size:18px}
  #title h1{font-size:clamp(22px,4vw,34px); color:#b84818; line-height:1.35}
  #title p{max-width:420px; font-size:14px; line-height:1.8; color:rgba(60,30,0,.78)}
  #title button{
    margin-top:6px; border:none; border-radius:999px; padding:14px 36px; cursor:pointer;
    background:linear-gradient(135deg,#FF6B9D,#FF9F43); color:#fff; font-weight:700; font-size:16px;
    box-shadow:0 4px 24px rgba(255,120,60,.45); font-family:inherit
  }
  #title .pair{display:flex; gap:18px; align-items:flex-end; margin:4px 0 2px}
  #title .pair img{height:92px; width:auto; image-rendering:auto; filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
  #music{
    position:fixed; top:10px; right:12px; z-index:40; border:1px solid rgba(224,168,92,.55);
    background:rgba(18,24,22,.82); color:#e0a85c; border-radius:999px; padding:9px 14px;
    font-size:12.5px; cursor:pointer; font-family:inherit
  }
  #music.on{background:rgba(224,168,92,.92); color:#121816}
  #hint{
    position:fixed; bottom:10px; left:50%; transform:translateX(-50%);
    background:rgba(255,255,255,.55); backdrop-filter:blur(6px); padding:6px 14px; border-radius:999px;
    font-size:13px; color:rgba(30,40,50,.8); white-space:nowrap;
    direction:rtl; text-align:center;
  }
  #mem{
    position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center;
    background:rgba(12,16,18,.82); backdrop-filter:blur(10px); padding:20px
  }
  #mem.on{display:flex}
  .mem-card{
    width:min(440px,92vw); background:#fff; border-radius:18px; overflow:hidden;
    box-shadow:0 24px 80px rgba(0,0,0,.45); position:relative
  }
  .mem-media{
    height:260px; background:#111; display:flex; align-items:center; justify-content:center; position:relative
  }
  .mem-media.vhs::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.08) 3px),
      linear-gradient(90deg, rgba(255,0,80,.06), rgba(0,255,200,.05));
    mix-blend-mode: overlay;
  }
  .mem-media img, .mem-media video{width:100%; height:100%; object-fit:cover; display:block}
  .mem-stack{position:relative; width:100%; height:100%}
  .mem-stack img{width:100%; height:100%; object-fit:cover}
  .mem-nav{
    position:absolute; top:50%; transform:translateY(-50%);
    width:36px; height:36px; border:none; border-radius:50%;
    background:rgba(0,0,0,.45); color:#fff; font-size:22px; cursor:pointer; line-height:1
  }
  .mem-nav.prev{left:8px}
  .mem-nav.next{right:8px}
  .mem-vhs{
    position:absolute; top:10px; left:10px; z-index:2;
    background:rgba(0,0,0,.55); color:#ffd93d;
    border-radius:8px; padding:4px 8px; font-size:12px; letter-spacing:.04em
  }
  .mem-empty{color:#aaa; font-size:14px}
  .mem-body{padding:16px 18px 18px; text-align:center; direction:rtl}
  .mem-date{color:#c07020; font-family:Fraunces,Georgia,serif; font-size:13px; margin-bottom:4px; direction:ltr}
  .mem-date:empty, .mem-title:empty, .mem-note:empty{display:none}
  .mem-photo-count{font-size:12px; color:#888; min-height:1em; margin-bottom:4px}
  .mem-title{font-size:18px; font-weight:700; margin-bottom:8px}
  .mem-note{font-size:13.5px; color:#555; line-height:1.75}
  .mem-actions{display:flex; gap:8px; margin-top:14px}
  .mem-actions button{
    flex:1; border:none; border-radius:12px; padding:12px; cursor:pointer; font-weight:700;
    font-family:inherit; font-size:14px
  }
  .mem-actions .go{background:#e0a85c; color:#121816}
  .mem-actions .x{background:#eee; color:#333}
  #year-gate{
    position:fixed; inset:0; z-index:45; background:rgba(10,14,16,.88); display:flex;
    align-items:center; justify-content:center; padding:24px; backdrop-filter:blur(8px)
  }
  #year-gate.hidden{display:none!important}
  .yg-box{
    max-width:440px; width:100%; text-align:center; color:#f2ebe0; background:rgba(22,28,26,.92);
    border:1px solid rgba(224,168,92,.35); border-radius:20px; padding:28px 22px;
    direction:rtl;
  }
  .yg-box h2{font-family:Fraunces,Georgia,serif; margin:0 0 10px}
  .yg-row{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:16px 0}
  .yg-row button{
    border:1px solid rgba(255,255,255,.28); background:rgba(255,255,255,.07); color:#fff;
    padding:14px 10px; border-radius:12px; font-size:1.1rem; cursor:pointer; font-family:Fraunces,Georgia,serif
  }
  .yg-row button.ok{background:#e0a85c; color:#121816; border-color:#e0a85c}
  .yg-err{min-height:1.2em; color:#ff9a8a}
  #cakeWin{
    position:absolute; inset:0; z-index:25; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:12px; border-radius:18px; text-align:center;
    padding:28px; color:#3a2010; direction:rtl;
    background:
      radial-gradient(500px 280px at 50% 20%, rgba(255,230,160,.95), transparent 70%),
      linear-gradient(180deg, rgba(255,214,170,.96), rgba(255,180,140,.94));
  }
  #cakeWin.hidden{display:none}
  #cakeWin .cake-visual{
    width:140px; height:120px; position:relative; margin-bottom:4px;
  }
  #cakeWin .layer{
    position:absolute; left:50%; transform:translateX(-50%); border-radius:8px;
  }
  #cakeWin .l3{bottom:8px; width:120px; height:28px; background:#f4a6c8}
  #cakeWin .l2{bottom:32px; width:96px; height:26px; background:#ffe08a}
  #cakeWin .l1{bottom:54px; width:72px; height:24px; background:#ff8fab}
  #cakeWin .candle{
    position:absolute; left:50%; bottom:76px; width:6px; height:22px; margin-left:-3px;
    background:#fff; border-radius:2px;
  }
  #cakeWin .flame{
    position:absolute; left:50%; bottom:96px; width:12px; height:16px; margin-left:-6px;
    background:radial-gradient(circle at 50% 70%, #fff6a0, #ff9f43 55%, transparent 70%);
    animation:flicker .35s ease-in-out infinite alternate;
  }
  @keyframes flicker{from{transform:scaleY(.9); opacity:.85} to{transform:scaleY(1.1); opacity:1}}
  #cakeWin .since{font-family:Fraunces,Georgia,serif; letter-spacing:.18em; color:#c07020; font-weight:700}
  #cakeWin h1{font-size:clamp(22px,4vw,32px); line-height:1.4}
  #cakeWin p{max-width:380px; line-height:1.75; font-size:14px; opacity:.85}
  #cakeWin button{
    margin-top:8px; border:none; border-radius:999px; padding:14px 32px; cursor:pointer;
    background:linear-gradient(135deg,#FF6B9D,#FF9F43); color:#fff; font-weight:700;
    font-size:15px; font-family:inherit; box-shadow:0 4px 20px rgba(255,120,60,.4)
  }
</style>
</head>
<body>
<button type="button" id="music" class="off" aria-pressed="false">♪ Felicita</button>
<div id="hint"><bdi>← →</bdi> حرکت &nbsp;|&nbsp; <bdi>Space</bdi> پرش</div>

<div id="year-gate">
  <div class="yg-box">
    <div style="color:#e0a85c;letter-spacing:.16em;font-family:Fraunces,Georgia,serif;margin-bottom:12px">SINCE 2015</div>
    <h2>قفل دوستی</h2>
    <p style="opacity:.88;line-height:1.7">تارا متولد ۱۳۷۴ است — امسال ۳۱. برای ورود، سالی را بزن که دوستی از آن شروع شد.</p>
    <div class="yg-row" id="yg-years"></div>
    <div class="yg-err" id="yg-err"></div>
  </div>
</div>

<div id="shell">
  <canvas id="game" width="768" height="448"></canvas>
  <div id="hud">
    <div class="brand">SINCE 2015 · TARA</div>
    <div class="stats"><span id="stage">اتاق ۱ / ۳۱</span><br><span id="memcount">خاطره ۰ / ۳۱</span></div>
  </div>
  <div id="roomBanner" class="hidden">
    <div class="rb-n"></div>
    <div class="rb-t"></div>
    <div class="rb-y"></div>
  </div>
  <div id="title">
    <div class="since">SINCE 2015</div>
    <div class="pair">
      <img src="sprites/sara-idle.png" alt="سارا">
      <img src="sprites/tara-idle.png" alt="تارا">
    </div>
    <h1>تولدت مبارک، تارا</h1>
    <button type="button" id="startBtn">شروع</button>
  </div>
  <div id="cakeWin" class="hidden">
    <div class="cake-visual" aria-hidden="true">
      <div class="layer l3"></div>
      <div class="layer l2"></div>
      <div class="layer l1"></div>
      <div class="candle"></div>
      <div class="flame"></div>
    </div>
    <div class="since">SINCE 2015</div>
    <h1>تولدت مبارک، تارا</h1>
    <button type="button" id="cakeReplay">از اول</button>
  </div>
</div>

<div id="mem">
  <div class="mem-card">
    <div class="mem-media" id="memMedia"></div>
    <div class="mem-body">
      <div class="mem-date" id="memDate"></div>
      <div class="mem-photo-count" id="memPhotoCount"></div>
      <div class="mem-title" id="memTitle"></div>
      <div class="mem-note" id="memNote"></div>
      <div class="mem-actions">
        <button type="button" class="x" id="memClose">بستن</button>
        <button type="button" class="go" id="memNext">باشه</button>
      </div>
    </div>
  </div>
</div>

<audio id="felicita" src="felicita.mp3" loop preload="auto" playsinline></audio>
<script src="game.js"></script>
</body>
</html>
